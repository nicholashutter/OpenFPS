org.gradle.jvmargs=-Xmx4g -XX:+UseZGC -XX:+ParallelRefProcEnabled -XX:+AlwaysPreTouch
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

# Java toolchain
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# Android
# libGDX's Android backend (gdx-backend-android) depends on androidx.core,
# so AndroidX must be enabled or checkDebugAarMetadata refuses the build.
# Jetifier stays off: nothing here uses a pre-AndroidX support library, and
# it would rewrite every dependency on every build for no benefit.
android.useAndroidX=true
android.enableJetifier=false

# Project metadata
org.openfps.version=0.1.0-SNAPSHOT
org.openfps.java.version=17
org.openfps.project.name=OpenFPS
